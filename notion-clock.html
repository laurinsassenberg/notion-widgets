<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uhr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..500,0..100&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #1a1a1a;
    --fg-muted: rgba(26, 26, 26, 0.48);
    --accent: #c44d2e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0ece4;
      --fg-muted: rgba(240, 236, 228, 0.5);
      --accent: #e09775;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Fraunces', Georgia, serif;
    color: var(--fg);
  }

  .stage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 24px;
    gap: 14px;
  }

  .time {
    font-size: clamp(4rem, 15vw, 9rem);
    font-weight: 300;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
    letter-spacing: -0.04em;
    line-height: 0.85;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 0.03em;
  }

  .separator {
    color: var(--accent);
    animation: pulse 2s ease-in-out infinite;
    margin: 0 0.02em;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .seconds {
    font-size: 0.32em;
    font-weight: 400;
    opacity: 0.5;
    letter-spacing: 0;
    align-self: flex-start;
    margin-top: 0.4em;
    margin-left: 0.2em;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    font-weight: 400;
    font-style: italic;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
    font-variation-settings: 'opsz' 14, 'SOFT' 100;
    margin-top: 4px;
  }
  .date .rest {
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="time">
      <span id="h">--</span><span class="separator">:</span><span id="m">--</span><span class="seconds" id="s">--</span>
    </div>
    <div class="date" id="date">—</div>
  </div>

  <script>
    const hEl = document.getElementById('h');
    const mEl = document.getElementById('m');
    const sEl = document.getElementById('s');
    const dateEl = document.getElementById('date');

    const pad = n => String(n).padStart(2, '0');

    function tick() {
      const now = new Date();
      hEl.textContent = pad(now.getHours());
      mEl.textContent = pad(now.getMinutes());
      sEl.textContent = pad(now.getSeconds());

      const weekday = now.toLocaleDateString('de-DE', { weekday: 'long' });
      const rest = now.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
      dateEl.innerHTML = `<span class="weekday">${weekday}</span><span class="rest">, ${rest}</span>`;
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
