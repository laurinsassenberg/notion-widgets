<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..500,0..100&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #1a1a1a;
    --fg-muted: rgba(26, 26, 26, 0.55);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0ece4;
      --fg-muted: rgba(240, 236, 228, 0.55);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Fraunces', Georgia, serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: clamp(16px, 3vw, 26px) clamp(28px, 5vw, 44px);
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.8vw, 14px);
    max-width: 620px;
    width: 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .content.ready { opacity: 1; }

  .quote {
    font-size: clamp(1.15rem, 2.8vw, 1.55rem);
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: -0.012em;
    font-variation-settings: 'opsz' 72, 'SOFT' 40;
    text-wrap: balance;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .quote.long {
    font-size: clamp(1rem, 2.3vw, 1.3rem);
    line-height: 1.45;
  }

  .quote.very-long {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    line-height: 1.5;
  }

  .author {
    font-size: clamp(0.85rem, 1.9vw, 1rem);
    font-weight: 400;
    font-style: italic;
    color: var(--fg-muted);
    letter-spacing: 0.005em;
    font-variation-settings: 'opsz' 24, 'SOFT' 80;
    text-align: center;
    position: relative;
    z-index: 1;
    margin-top: clamp(2px, 0.8vw, 6px);
  }

  /* author erscheint ohne Präfix */
</style>
</head>
<body>
  <div class="stage">
    <div class="content" id="content">
      <div class="quote" id="quote">…</div>
      <div class="author" id="author"></div>
    </div>
  </div>

<script>
const FALLBACK_QUOTES = [
  { q: "The unexamined life is not worth living.", a: "Socrates" },
  { q: "We suffer more often in imagination than in reality.", a: "Seneca" },
  { q: "You have power over your mind — not outside events. Realize this, and you will find strength.", a: "Marcus Aurelius" },
  { q: "The cave you fear to enter holds the treasure you seek.", a: "Joseph Campbell" },
  { q: "What we do in life echoes in eternity.", a: "Marcus Aurelius" },
  { q: "Stay hungry, stay foolish.", a: "Steve Jobs" },
  { q: "The obstacle is the way.", a: "Marcus Aurelius" },
  { q: "He who has a why to live for can bear almost any how.", a: "Friedrich Nietzsche" },
  { q: "The greatest weapon against stress is our ability to choose one thought over another.", a: "William James" },
  { q: "Action is the foundational key to all success.", a: "Pablo Picasso" },
  { q: "What you seek is seeking you.", a: "Rumi" },
  { q: "Do not go where the path may lead, go instead where there is no path and leave a trail.", a: "Ralph Waldo Emerson" },
  { q: "The best way to predict the future is to create it.", a: "Peter Drucker" },
  { q: "Discipline equals freedom.", a: "Jocko Willink" },
  { q: "Whether you think you can, or you think you can't — you're right.", a: "Henry Ford" },
  { q: "Be yourself; everyone else is already taken.", a: "Oscar Wilde" },
  { q: "Don't aim at success. The more you aim at it, the more you are going to miss it.", a: "Viktor Frankl" },
  { q: "Between stimulus and response there is a space. In that space is our power to choose our response.", a: "Viktor Frankl" },
  { q: "First, solve the problem. Then, write the code.", a: "John Johnson" },
  { q: "The only way to do great work is to love what you do.", a: "Steve Jobs" },
  { q: "Knowing yourself is the beginning of all wisdom.", a: "Aristotle" },
  { q: "Quality is not an act, it is a habit.", a: "Aristotle" },
  { q: "Make each day your masterpiece.", a: "John Wooden" },
  { q: "Slow is smooth, smooth is fast.", a: "Navy SEAL Maxim" },
  { q: "The way out is through.", a: "Robert Frost" },
  { q: "Comparison is the thief of joy.", a: "Theodore Roosevelt" },
  { q: "If you want to go fast, go alone. If you want to go far, go together.", a: "African Proverb" },
  { q: "Begin at once to live, and count each separate day as a separate life.", a: "Seneca" },
  { q: "The pessimist sees difficulty in every opportunity. The optimist sees opportunity in every difficulty.", a: "Winston Churchill" },
  { q: "It is not the man who has too little, but the man who craves more, that is poor.", a: "Seneca" },
  { q: "Everything you've ever wanted is on the other side of fear.", a: "George Addair" },
  { q: "Simplicity is the ultimate sophistication.", a: "Leonardo da Vinci" }
];

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function fallbackQuote() {
  return FALLBACK_QUOTES[dayOfYear(new Date()) % FALLBACK_QUOTES.length];
}

async function fetchTodayQuote() {
  try {
    const res = await fetch('https://zenquotes.io/api/today');
    if (!res.ok) throw new Error('not ok');
    const data = await res.json();
    if (Array.isArray(data) && data[0] && data[0].q && data[0].a) {
      return { q: data[0].q, a: data[0].a };
    }
    throw new Error('shape');
  } catch (e) {
    return fallbackQuote();
  }
}

function applyLengthClass(el, text) {
  el.classList.remove('long', 'very-long');
  if (text.length > 180) el.classList.add('very-long');
  else if (text.length > 110) el.classList.add('long');
}

async function load() {
  const { q, a } = await fetchTodayQuote();
  const quoteEl = document.getElementById('quote');
  const authorEl = document.getElementById('author');
  const stage = document.getElementById('content');

  quoteEl.textContent = `"${q}"`;
  applyLengthClass(quoteEl, q);
  authorEl.textContent = a;

  requestAnimationFrame(() => stage.classList.add('ready'));
}

load();
setInterval(load, 60 * 60 * 1000);
</script>
</body>
</html>
